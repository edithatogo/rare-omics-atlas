[project]
name = "rare-omics-hf-release"
version = "0.1.0"
description = "Source-bound Hugging Face publication for rare-omics-atlas"
requires-python = ">=3.11"
dependencies = ["huggingface-hub==2.4.0", "httpx2[socks]==2.16.2"]

[dependency-groups]
dev = [
  "coverage==7.17.4",
  "diff-cover==11.0.4",
  "pip-audit==2.10.1",
  "pyright==1.1.409",
  "ruff==0.15.13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
