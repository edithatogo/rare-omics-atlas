name: Strict CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never

  strict-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
      VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install locked Python tooling
        run: uv sync --project tools/hf-release --frozen --python 3.15.2
      - name: Install pinned native verification tools
        run: uv run --project tools/hf-release --frozen --python 3.15.2 python scripts/bootstrap.py
      - name: Replay actual staged native hook on the current PR merge tree
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          git merge-base --is-ancestor "$VERIFY_BASE" "$candidate"
          guard="$RUNNER_TEMP/atlas-privacy-source"
          runtime="$RUNNER_TEMP/atlas-privacy-guard"
          mkdir -p artifacts/verification/ci
          trap 'if [ -d artifacts/verification/latest ]; then cp -a artifacts/verification/latest/. artifacts/verification/ci/; fi' EXIT
          git clone --quiet --no-checkout https://github.com/edithatogo/repository-standards.git "$guard"
          git -C "$guard" checkout --quiet --detach 2efdbd988064f6857795b9fa9ed4e1d08d18791d
          uv venv --python 3.15.2 "$RUNNER_TEMP/atlas-privacy-bootstrap"
          bash "$guard/privacy/install.sh" "$RUNNER_TEMP/atlas-privacy-bootstrap/bin/python" "$runtime"
          uv run --project tools/hf-release --frozen --python 3.15.2 python scripts/hooks.py install \
            --privacy-root "$guard" --privacy-python "$runtime/venv/bin/python" --gitleaks "$runtime/bin/gitleaks"
          git reset --soft "$VERIFY_BASE"
          test "$(git write-tree)" = "$tree"
          git -c user.name='GitHub Actions' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'CI native-hook replay' 2>&1 | tee artifacts/verification/ci/native-hook.log
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          printf '{"base":"%s","candidate":"%s","tree":"%s","replay_commit":"%s","hook_passed":true}\n' \
            "$VERIFY_BASE" "$candidate" "$tree" "$(git rev-parse HEAD)" > artifacts/verification/ci/native-hook.json
          git reset --hard "$candidate"
      - name: Run strict verification
        if: github.event_name != 'pull_request'
        run: uv run --project tools/hf-release --frozen --python 3.15.2 python scripts/verify.py --deep --output artifacts/verification/ci
      - name: Inventory locked software components
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: tools
          format: spdx-json
          output-file: artifacts/verification/ci/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Publish measured coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: artifacts/verification/ci/rust-lcov.info,artifacts/verification/ci/python-coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Preserve actual verification outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-verification-${{ github.sha }}
          path: artifacts/verification/ci
          if-no-files-found: error
          retention-days: 14

  privacy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: edithatogo/repository-standards/.github/actions/privacy-secrets@2efdbd988064f6857795b9fa9ed4e1d08d18791d
        with:
          profile: repository
