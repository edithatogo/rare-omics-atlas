name: Official local qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registered owner device and native OS
        required: true
        type: choice
        default: macos-arm64
        options: [macos-arm64, windows-x64, linux-x64]
permissions:
  contents: read
concurrency:
  group: local-qualification-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'edithatogo/rare-venomics' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.target == 'macos-arm64' && '["self-hosted","macOS","ARM64","rare-omics-local"]' || inputs.target == 'windows-x64' && '["self-hosted","Windows","X64","rare-omics-local"]' || '["self-hosted","Linux","X64","rare-omics-local"]') }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      VERIFY_BASE: HEAD^
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install locked Python tooling
        run: uv sync --project tools/hf-release --frozen --python 3.15.2
      - name: Install pinned native verification tools
        env:
          CARGO_HOME: ${{ runner.temp }}/atlas-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/atlas-rustup-${{ github.run_id }}
        run: uv run --project tools/hf-release --frozen --python 3.15.2 python scripts/bootstrap.py
      - name: Run the same strict command as hosted CI
        env:
          CARGO_HOME: ${{ runner.temp }}/atlas-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/atlas-rustup-${{ github.run_id }}
        run: uv run --project tools/hf-release --frozen --python 3.15.2 python scripts/verify.py --deep --output artifacts/verification/local
      - name: Preserve observed device qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-device-${{ inputs.target }}-${{ github.sha }}
          path: artifacts/verification/local
          if-no-files-found: error
          retention-days: 14
