name: Publish reviewed V01 public metadata

on:
  workflow_run:
    workflows: ['Strict CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v01-public-metadata-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'edithatogo/rare-venomics' &&
      github.event.workflow_run.head_repository.id == 1467227964 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The publisher tests verify immutable historical Git objects.
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Select only the reviewed activation revision and exact manifest
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          changed=$(git diff --name-only HEAD^ HEAD -- .github/workflows/publish-v01-public-metadata.yml)
          if [[ -z "$changed" ]]; then
            echo 'No reviewed activation change; no publication.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s  %s\n' \
            '4e0fcc255351e5b557d731916413d55e8dd5bb61789733c1c1cb99ecb97db7b6' \
            'research/releases/2026-11-25-v01/manifest.json' | sha256sum -c -
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.activation.outputs.publish == 'true'
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Verify the existing locked publisher and exact release without credentials
        if: steps.activation.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e '8cfc85110911a2991301b358e4510e28026d13b8:tools/hf-release/publisher.py'
          uv sync --project tools/hf-release --frozen --python 3.15.2
          uv run --project tools/hf-release --frozen python -m unittest discover -s tools/hf-release/tests -v
          uv run --project tools/hf-release --frozen python tools/hf-release/publisher.py \
            --manifest research/releases/2026-11-25-v01/manifest.json --root . \
            --data-root "$RUNNER_TEMP/v01-unused-cache" --source-revision "$SOURCE_REVISION" \
            --receipt "$RUNNER_TEMP/v01-public-dry-run.json"
      - name: Publish only the pinned metadata release (no source fetch or overwrite)
        if: steps.activation.outputs.publish == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo 'HF_TOKEN is not configured; publication remains externally blocked.'
            exit 1
          fi
          uv run --project tools/hf-release --frozen python tools/hf-release/publisher.py \
            --manifest research/releases/2026-11-25-v01/manifest.json --root . \
            --data-root "$RUNNER_TEMP/v01-unused-cache" --source-revision "$SOURCE_REVISION" \
            --receipt "$RUNNER_TEMP/v01-public-upload.json" --upload --no-overwrite
      - name: Preserve publication or failure receipt
        if: always() && steps.activation.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v01-public-metadata-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/v01-public-dry-run.json
            ${{ runner.temp }}/v01-public-upload.json
          if-no-files-found: warn
          retention-days: 14
